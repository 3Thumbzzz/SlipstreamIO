name: Release

# Builds the Windows and macOS apps. A pushed tag (v1.0.0, …) also publishes a
# GitHub release with both attached; a manual run only uploads them as
# workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: SlipStreamIO-windows-x64.zip
          - os: macos-latest
            artifact: SlipStreamIO-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3 pillow

      - name: Smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import trackcleaner.app, trackcleaner.ui.main_window; print('imports ok')"

      - name: Build
        run: pyinstaller SlipStreamIO.spec --noconfirm

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/SlipStreamIO -DestinationPath ${{ matrix.artifact }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/SlipStreamIO.app ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body: |
            **Windows (x64):** unzip `SlipStreamIO-windows-x64.zip` anywhere and run `SlipStreamIO.exe`. Settings, backups and logs are kept in that folder.

            **macOS (Apple silicon):** unzip `SlipStreamIO-macos-arm64.zip` and move `SlipStreamIO.app` to Applications. The app is not signed: the first time, right-click it and choose **Open**. Settings, backups and logs are kept in `~/Library/Application Support/SlipStreamIO`.

            **Both need ffmpeg** (with ffprobe) installed: on Windows on the PATH, on macOS `brew install ffmpeg`.
